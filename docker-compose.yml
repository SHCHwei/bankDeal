services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - .:/app
    environment:
      - DB_HOST=bankdeal-db-1
      - DB_PORT=3306
      - DB_USER=user
      - DB_PASSWORD=user1
      - DB_NAME=bank
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:12.3.2
    restart: always
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: bankDeal
      MYSQL_USER: user
      MYSQL_PASSWORD: user1
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5